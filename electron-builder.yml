appId: com.troublecrack.app
productName: TroubleCrack
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
publish:
  provider: github
  # owner/repo are read from the GH_REPO env var or the repository field at
  # release time; configure them in the GitHub Actions workflow.
  releaseType: release
